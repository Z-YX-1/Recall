[project]
name = "recall"
version = "0.1.0"
description = "Personal RAG knowledge base (Recall / 拾忆)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "qdrant-client>=1.12.0,<2",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "fastmcp>=2.0.0,<3",
    "pydantic>=2.9.0,<3",
    "FlagEmbedding>=1.3.0,<2",
    "openai>=1.50.0,<4",
    "httpx>=0.27.0,<1",
    "tiktoken>=0.8.0,<1",
    "python-frontmatter>=1.1.0,<2",
    "python-dotenv>=1.0.0,<2",
    "numpy>=1.26.0,<3",
    "watchdog>=6.0.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<2",
]
eval = [
    # R-32：Ragas 评测 RAG 质量（tech.md §10）。⚠️ langchain-community 必须 <0.4——
    # ragas 0.4.3 在模块顶层 import langchain_community.chat_models.vertexai，
    # 该模块在 0.4 里已移除（2026-09-22 实测 ImportError）。
    "ragas>=0.4.0,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=1.0,<2",
    "pandas>=2.0,<4",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["recall*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["FlagEmbedding.*", "frontmatter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
